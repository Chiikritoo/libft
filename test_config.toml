texture_cache_size = 1024
lod_distance = 2000
shadow_quality = "ultra"
shadow_distance = 1000
particle_limit = 2000
physics_steps = 60
collision_quality = "high"
audio_quality = "ultra"
network_optimization = true

# Profils de performance
[performance.profiles]
[[performance.profiles.ultra]]
