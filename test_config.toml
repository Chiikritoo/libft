# ==================== ACHIEVEMENTS ====================
[achievements]
enabled = true
tracking = true
notifications = true
sound_effects = true
show_progress = true

[achievements.list]
[[achievements.list.combat]]
name = "First Blood"
description = "Kill your first enemy"
progress = 0
max_progress = 1
reward = "title_first_blood"

[[achievements.list.exploration]]
name = "Explorer"
description = "Visit all areas in the game"
progress = 5
max_progress = 20
reward = "title_explorer"

[[achievements.list.survival]]
name = "Survivor"
description = "Complete the game on nightmare difficulty"
progress = 0
max_progress = 1
reward = "title_survivor"

# ==================== STATISTIQUES ====================
[statistics]
tracking = true
auto_save = true
reset_on_new_game = false

[statistics.categories]
[[statistics.categories.combat]]
name = "Combat"
stats = ["kills", "deaths", "accuracy", "headshots", "damage_dealt", "damage_taken"]

[[statistics.categories.exploration]]
name = "Exploration"
stats = ["distance_traveled", "areas_discovered", "secrets_found", "time_played"]

[[statistics.categories.achievements]]
name = "Achievements"
stats = ["achievements_unlocked", "completion_percentage", "rare_achievements"]

# ==================== BACKUP ET SAUVEGARDE ====================
[backup]
enabled = true
auto_backup = true
backup_interval = 3600
max_backups = 10
backup_location = "./backups"
compression = true
encryption = false

[backup.settings]
include_saves = true
include_configs = true
include_mods = false
include_logs = false
backup_size_limit = 1000000000

# ==================== MISE À JOUR ====================
[updates]
auto_check = true
check_interval = 86400
auto_download = false
auto_install = false
beta_updates = false
mod_updates = true

[updates.channels]
stable = true
beta = false
alpha = false
experimental = false

# ==================== SUPPORT ====================
[support]
contact_email = "support@doom-nukem.com"
bug_report_url = "https://github.com/42student/doom-nukem/issues"
documentation_url = "https://doom-nukem.readthedocs.io"
community_discord = "https://discord.gg/doom-nukem"
reddit_community = "https://reddit.com/r/doom-nukem"

[support.feedback]
enabled = true
anonymous = true
include_system_info = true
include_logs = true
auto_submit_crashes = true
 