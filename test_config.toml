# ==================== DEBUG ULTRA AVANCÉ ====================
[debug]
enabled = false
log_level = "info"
show_hitboxes = false
show_fps_graph = false
show_memory_usage = false
show_network_stats = false
console_enabled = true
console_history = 100
show_debug_info = false
show_performance_metrics = false

# Outils de debug
[debug.tools]
profiler = false
memory_tracker = false
network_analyzer = false
collision_debugger = false
audio_debugger = false
input_debugger = false

# ==================== MODS ULTRA AVANCÉ ====================
[mods]
enabled = true
auto_update = true
mod_folder = "./mods"
mod_loader = "native"
mod_priority = "load_order"
mod_dependencies = true
mod_conflicts = true

# Mods actifs avec versions
