show_fps = true
show_ping = true
show_minimap = true
show_compass = true
show_objectives = true
show_health_bar = true
show_ammo_counter = true
show_score = true
show_kill_feed = true
show_chat = true

# Interface HUD détaillée
[ui.hud]
health_bar = true
health_bar_style = "modern"
ammo_counter = true
ammo_counter_style = "minimal"
score_display = true
score_position = "top_right"
kill_feed = true
kill_feed_duration = 5.0
chat_window = true
chat_window_size = "medium"
minimap = true
minimap_size = "large"
compass = true
