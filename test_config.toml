# ========================================
# DOOM NUKEM ULTRA MEGA CONFIGURATION
# ========================================
# Fichier de test ULTRA avancé pour le parser TOML
# Teste toutes les fonctionnalités et limites

# ==================== MÉTADONNÉES GLOBALES ====================
title = "Doom Nukem Ultra Mega Config"
version = "3.0.0-beta"
author = "42 Student - TOML Master"
description = "Configuration ULTRA avancée pour Doom Nukem avec TOUTES les fonctionnalités"
build_date = "2024-01-15"
license = "MIT"
repository = "https://github.com/42student/doom-nukem"
documentation = "https://doom-nukem.readthedocs.io"

# ==================== SYSTÈME ====================
[system]
platform = "linux"
architecture = "x86_64"
compiler = "gcc"
optimization_level = 3
debug_mode = false
log_level = "info"
max_memory = 8192
thread_count = 8

[system.paths]
config_dir = "/home/player/.config/doom-nukem"
save_dir = "/home/player/.local/share/doom-nukem/saves"
mod_dir = "/home/player/.local/share/doom-nukem/mods"
log_dir = "/var/log/doom-nukem"
temp_dir = "/tmp/doom-nukem"

[system.environment]
DISPLAY = ":0"
XDG_SESSION_TYPE = "x11"
LANG = "en_US.UTF-8"
LC_ALL = "en_US.UTF-8"

# ==================== GRAPHICS ULTRA AVANCÉ ====================
[graphics]
# Résolution principale avec tous les paramètres
resolution = { width = 2560, height = 1440, refresh_rate = 165, aspect_ratio = "16:9", scaling = "native" }
fullscreen = true
borderless = false
vsync = true
triple_buffering = true
fov = 110.0
gamma = 1.2
brightness = 0.9
contrast = 1.1
saturation = 1.0

# Couleurs du jeu avec palette complète
colors = ["red", "green", "blue", "yellow", "purple", "orange", "pink", "cyan", "magenta", "lime", "brown", "white", "black", "gray", "silver", "gold"]

# Paramètres graphiques ultra avancés
[graphics.advanced]
raytracing = true
raytracing_quality = "ultra"
shadows = "raytraced"
shadow_resolution = 4096
texture_quality = "ultra"
texture_filtering = "anisotropic_16x"
anti_aliasing = "msaa_16x"
motion_blur = true
motion_blur_strength = 0.5
depth_of_field = true
dof_focus_distance = 10.0
dof_aperture = 2.8
ambient_occlusion = "ssao"
ssao_radius = 0.5
ssao_intensity = 1.0
bloom = true
bloom_threshold = 1.0
bloom_intensity = 0.8
lens_flare = true
chromatic_aberration = false
vignette = true
vignette_intensity = 0.3

# Effets de particules
[graphics.particles]
enabled = true
max_particles = 10000
particle_quality = "ultra"
smoke_effects = true
fire_effects = true
explosion_effects = true
blood_effects = true
gore_effects = true

# Post-processing
[graphics.post_processing]
enabled = true
effects = ["bloom", "ssao", "motion_blur", "dof", "lens_flare", "vignette"]
color_grading = { temperature = 0.0, tint = 0.0, exposure = 0.0, contrast = 0.0, saturation = 0.0, highlights = 0.0, shadows = 0.0, whites = 0.0, blacks = 0.0 }

# ==================== AUDIO ULTRA AVANCÉ ====================
[audio]
master_volume = 0.8
music_volume = 0.6
sfx_volume = 0.9
ambient_volume = 0.4
voice_volume = 0.7
ui_volume = 0.5
footstep_volume = 0.8
weapon_volume = 0.9
explosion_volume = 0.7

# Configuration audio avancée
[audio.advanced]
sample_rate = 48000
bit_depth = 24
channels = 8
buffer_size = 512
latency = 5
spatial_audio = true
hrtf_enabled = true
reverb_quality = "ultra"

# Effets audio détaillés
[audio.effects]
reverb = true
reverb_preset = "cathedral"
echo = false
echo_delay = 100
spatial_audio = true
surround_sound = "7.1"
headphone_virtualization = true
equalizer = { bass = 0.8, low_mid = 1.0, mid = 1.0, high_mid = 1.1, treble = 0.9, presence = 1.0, brilliance = 0.8 }

# Musique dynamique
[audio.music]
dynamic_music = true
music_tracks = ["main_theme", "combat", "exploration", "boss_battle", "victory", "defeat", "menu", "credits"]
crossfade_duration = 2.0
volume_fade = true

# ==================== CONTROLS ULTRA AVANCÉ ====================
[controls]
mouse_sensitivity = 1.2
mouse_dpi = 800
invert_y = false
auto_aim = true
auto_aim_strength = 0.8
mouse_acceleration = false
raw_input = true
mouse_smoothing = false
mouse_filtering = true

# Contrôles de mouvement détaillés
[controls.movement]
forward = "W"
backward = "S"
left = "A"
right = "D"
jump = "SPACE"
crouch = "CTRL"
sprint = "SHIFT"
walk = "ALT"
slide = "C"
mantle = "V"
dash = "Q"
roll = "R"

# Contrôles d'action détaillés
[controls.actions]
shoot = "MOUSE1"
shoot_secondary = "MOUSE2"
reload = "R"
use = "E"
switch_weapon = "Q"
switch_weapon_reverse = "MOUSEWHEEL"
inventory = "TAB"
map = "M"
pause = "ESC"
quick_save = "F5"
quick_load = "F9"
screenshot = "F12"
console = "~"

# Contrôles de communication
[controls.communication]
chat = "T"
team_chat = "Y"
voice_chat = "V"
emote = "G"
emote_wheel = "H"
quick_emotes = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "0"]

# Contrôles de véhicule
[controls.vehicle]
enter_exit = "F"
accelerate = "W"
brake = "S"
turn_left = "A"
turn_right = "D"
handbrake = "SPACE"
horn = "H"
lights = "L"

# ==================== GAMEPLAY ULTRA AVANCÉ ====================
[gameplay]
difficulty = "nightmare"
auto_save = true
auto_save_interval = 300
crosshair = true
crosshair_style = "dynamic"
blood_effects = true
gore_level = 4
friendly_fire = false
team_damage = 0.5
realistic_damage = true
bullet_physics = true
ragdoll_physics = true

# Armes disponibles avec stats
weapons = ["pistol", "shotgun", "rifle", "sniper", "rocket_launcher", "plasma_gun", "bfg", "chainsaw", "fists", "grenades"]

