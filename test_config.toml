# ==================== PERFORMANCE ULTRA AVANCÉ ====================
[performance]
max_fps = 165
vsync = true
threading = true
cache_size = 2048
memory_limit = 8192
cpu_priority = "high"
gpu_priority = "high"
power_mode = "performance"

# Optimisations détaillées
[performance.optimizations]
